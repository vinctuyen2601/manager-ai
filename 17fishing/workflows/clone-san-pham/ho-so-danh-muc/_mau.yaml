# MẪU HỒ SƠ DANH MỤC
#
# Mỗi danh mục hàng một tệp. Instructions của workflow không chứa chữ nào
# riêng của một loại hàng — mọi thứ khác nhau giữa máy câu và phao đều khai ở
# đây. Thêm danh mục mới = thêm một tệp, không sửa workflow.
#
# Vì sao cần: lần clone đầu tôi viết thẳng đặc thù máy câu vào quy trình (cỡ
# HA, tỉ số truyền, lực hãm). Sang cái phao thì quy trình đó vô dụng, vì phao
# không có tỉ số truyền mà có độ nhạy, tải trọng, loại pin.

ma: ten-khoa-khong-dau
ten: Tên hiển thị
danhMucId: uuid-trong-cms

thongSo:
  # Thiếu một mục batBuoc là DỪNG ở cổng sau bước 3. Không đoán, không bỏ qua.
  batBuoc: []
  tuyChon: []
  # Mục nào mà giá trị thường nằm TRONG ẢNH chứ không trong HTML.
  namTrongAnh: []

tuVung:
  dung: []     # từ shop đang dùng, phải theo
  tranh: []    # từ đồng nghĩa dễ lỡ tay dùng

# Từ tiếng Trung để LỌC đánh giá 1688, truyền cho doc-danh-gia.mjs.
# Bắt buộc khai: bản đầu gõ cứng từ của máy câu vào script, sang cần câu thì
# 钓竿 từ "nói về hàng khác" biến thành tên của chính món hàng — cờ bật ngược.
tuVungDanhGia:
  taHang: []   # --tu-ta   từ chứng tỏ người viết đang nói về CHÍNH món này
  nhamHang: [] # --tu-nham từ của món KHÁC mà gian hàng cũng bán

bienThe:
  theo: ""     # chia biến thể theo chiều nào
  mauMa: ""    # dạng mã, để bộ kiểm bắt mã lạ
  anhRieng: "" # ảnh biến thể nên thể hiện điều gì

boAnh: []      # danh sách tấm cần, theo thứ tự ưu tiên

# Mô tả từng tấm cho công cụ sinh ảnh. Khoá phải trùng `boAnh`.
# Bắt buộc khai: bản đầu gõ cứng sáu tấm của máy câu vào prompt-stitch.mjs
# ("trên tay" vì khách lo kích thước, "so sánh cỡ" theo tỉ số truyền) — sang
# cần câu thì tấm cần là "thu gọn" và "độ cong", hoàn toàn khác.
boAnhMoTa: {}

# Ba huy hiệu thông số đáng đưa lên ảnh nhất, mỗi cái một dòng ngắn.
# Đây là chỗ khác nhau nhất giữa các ngành hàng: máy câu khoe lực hãm, cần câu
# khoe sức kéo và độ dài thu gọn, phao khoe tải chì.
badgeGoiY: []

# Bộ phận KHÔNG được để chữ đè lên — chỗ khách nhìn để đánh giá chất lượng.
khongDeChuDeLen: []

cauHoiKhung: []  # khung câu hỏi thường gặp, {ngoặc} thay bằng số trong hồ sơ

khongDuocNoiMacDinh: []  # điều cấm mặc định của loại hàng

ruiRoHayGap: []  # điểm hỏng hay bị khiếu nại, đưa vào phần bảo quản

ngonNguThiGiac:
  # Stitch không nhìn thấy bảng thông số. Nó cần biết vật thể ĐỂ ĐÂU thì hợp
  # lý, cạnh cái gì, ánh sáng kiểu nào. Thiếu phần này thì ảnh đúng thông số
  # mà sai ngữ cảnh: máy câu nằm trên bàn văn phòng, phao chụp giữa ban ngày.
  boiCanhHopLe: []
  boiCanhCam: []
  daoCuChoPhep: []
  gioChup: ""
  loiThiGiacHayGap: []
